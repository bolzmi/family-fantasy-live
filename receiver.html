<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bolz Family Fantasy Live Receiver</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}iframe{border:0;width:100%;height:100%;display:block}</style>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <iframe id="dashboard" src="./?receiver=1" allow="fullscreen"></iframe>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    context.start(options);

    // Cast renders some of the dashboard's smallest text poorly. Keep the
    // normal browser/AirPlay presentation intact, but simplify the TV receiver
    // and use conservative integer-pixel typography for the text that remains.
    const frame = document.getElementById('dashboard');
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.id = 'cast-text-stability';
        style.textContent = `
          html, body, #app, #app * {
            text-rendering: auto !important;
            font-kerning: none !important;
            font-feature-settings: "kern" 0, "liga" 0 !important;
          }
          body.receiver, body.receiver * {
            font-family: Arial, Helvetica, sans-serif !important;
            font-stretch: normal !important;
            letter-spacing: 0 !important;
            word-spacing: 0 !important;
          }
          body.receiver #app {
            transform: none !important;
          }

          /* On the Cast receiver, team names + scores + week progress are the
             useful matchup-level information. Removing the tiny starter-name
             strip avoids the one persistent Cast text-rendering problem. */
          body.receiver .starter-name,
          body.receiver .meta-dot {
            display: none !important;
          }
          body.receiver .team-meta {
            margin-top: 4px !important;
            overflow: visible !important;
          }
          body.receiver .progress {
            display: inline-block !important;
            margin: 0 !important;
            padding: 2px 7px !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            line-height: 1.1 !important;
          }
          body.receiver .team-name {
            font-size: 17px !important;
            font-weight: 700 !important;
          }

          /* Give Top Starters ~20% more vertical room while keeping FPA large
             enough for the five-level scoring feed. */
          body.receiver .side {
            grid-template-rows: 32% 1fr !important;
          }
          body.receiver .event {
            padding-top: 10px !important;
            padding-bottom: 10px !important;
          }
          body.receiver .event-player {
            font-size: 24px !important;
            font-weight: 700 !important;
          }
          body.receiver .event-detail {
            font-size: 13px !important;
            font-weight: 400 !important;
          }
          body.receiver .event-history {
            margin-top: 5px !important;
            padding-top: 4px !important;
          }
          body.receiver .history-row {
            padding: 2px 0 !important;
          }
          body.receiver .history-1 { font-size: 14px !important; }
          body.receiver .history-2 { font-size: 13px !important; }
          body.receiver .history-3 { font-size: 12px !important; }
          body.receiver .history-4 { font-size: 11px !important; }
          body.receiver .history-row strong,
          body.receiver .history-points {
            font-weight: 700 !important;
          }
          body.receiver .history-owner {
            font-weight: 400 !important;
          }

          body.receiver .leaders {
            padding-top: 9px !important;
            padding-bottom: 8px !important;
          }
          body.receiver .section-title {
            font-size: 12px !important;
            font-weight: 700 !important;
            margin-bottom: 3px !important;
          }
          body.receiver .leader-row {
            padding: 4px 0 !important;
          }
          body.receiver .leader-name {
            font-size: 15px !important;
            font-weight: 700 !important;
            line-height: 1.05 !important;
          }
          body.receiver .nfl-team {
            font-size: 11px !important;
            font-weight: 700 !important;
          }
          body.receiver .leader-owner {
            font-size: 11px !important;
            font-weight: 400 !important;
            line-height: 1 !important;
          }
          body.receiver .leader-score {
            font-size: 18px !important;
            font-weight: 700 !important;
          }

          body.receiver .summary-title,
          body.receiver .summary-label,
          body.receiver .eyebrow {
            font-weight: 700 !important;
          }
          body.receiver .summary-value {
            font-size: 15px !important;
            font-weight: 700 !important;
          }
          body.receiver footer,
          body.receiver .status,
          body.receiver .sub {
            font-weight: 400 !important;
          }
        `;
        doc.head.appendChild(style);
      } catch (err) {
        console.warn('Cast text stabilization could not be applied', err);
      }
    });
  </script>
</body>
</html>
