<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bolz Family Fantasy Live Receiver</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}iframe{border:0;width:100%;height:100%;display:block}</style>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <iframe src="./?receiver=1" allow="fullscreen"></iframe>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    context.start(options);
  </script>
