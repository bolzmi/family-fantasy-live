<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111d" />
  <title>Bolz Family Fantasy Live</title>
  <style>
    :root{--bg:#07111d;--panel:#0d1b2a;--panel2:#12263a;--text:#f4f7fb;--muted:#94a8bd;--line:#20384f;--good:#43d17f;--hot:#ffcc4d;--bad:#ff6b6b;--accent:#65a9ff}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}body{overflow:hidden}
    #app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 22px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px}h1{margin:0;font-size:clamp(28px,3vw,48px);letter-spacing:.01em}.sub{color:var(--muted);font-size:clamp(13px,1.2vw,18px);margin-top:4px}.status{text-align:right;color:var(--muted);font-size:clamp(12px,1vw,16px)}
    .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 14px var(--good);margin-right:7px}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr);gap:14px}.matchups,.side{min-height:0}.matchups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 9px 30px rgba(0,0,0,.18)}
    .matchup{display:grid;grid-template-rows:1fr auto 1fr;gap:6px;min-height:0}.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.team-name{font-weight:750;font-size:clamp(17px,1.5vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team-score{font-weight:850;font-variant-numeric:tabular-nums;font-size:clamp(30px,3.1vw,50px)}.team-meta{color:var(--muted);font-size:clamp(11px,.9vw,14px);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em}.vs:before,.vs:after{content:"";height:1px;background:var(--line);flex:1}.winner .team-score{color:var(--good)}
    .side{display:grid;grid-template-rows:auto auto 1fr;gap:12px}.event{position:relative;overflow:hidden;padding:18px}.event:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,204,77,.13),transparent 55%);pointer-events:none}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--hot);text-transform:uppercase}.event-player{font-size:clamp(24px,2.4vw,40px);font-weight:900;margin-top:6px;line-height:1.02}.event-detail{font-size:clamp(15px,1.2vw,20px);color:var(--muted);margin-top:7px}.delta{font-weight:900;color:var(--good)}
    .pulse-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pulse-stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px}.pulse-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:850}.pulse-value{font-size:clamp(16px,1.5vw,24px);font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .leaders{min-height:0;overflow:hidden}.section-title{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}.leader-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.leader-row:first-of-type{border-top:0}.leader-name{font-weight:750;font-size:clamp(14px,1.1vw,18px)}.leader-owner{font-size:12px;color:var(--muted);margin-top:2px}.leader-score{font-weight:850;font-size:clamp(18px,1.5vw,24px);font-variant-numeric:tabular-nums}
    footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;white-space:nowrap}#error{display:none;color:#ffd0d0;background:#401e28;border:1px solid #713044;padding:9px 12px;border-radius:10px}
    @media(max-width:1000px){body{overflow:auto}#app{height:auto;min-height:100vh}main{grid-template-columns:1fr}.matchups{grid-template-columns:1fr 1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:auto}.leaders{max-height:50vh}}@media(max-width:700px){.matchups{grid-template-columns:1fr}.side{grid-template-columns:1fr}.pulse-grid{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
<div id="app">
  <header><div><h1>Bolz Family Fantasy Live</h1><div class="sub" id="leagueLine">Loading league…</div></div><div class="status"><span class="live-dot"></span><span id="statusText">Connecting</span><br><span id="updated"></span></div></header>
  <main>
    <section class="matchups" id="matchups"></section>
    <aside class="side">
      <section class="card event" id="eventCard"><div class="eyebrow">Fantasy Pulse</div><div class="event-player" id="eventPlayer">Waiting for scoring…</div><div class="event-detail" id="eventDetail">When somebody's player gains points, it will show here.</div></section>
      <section class="pulse-grid">
        <div class="pulse-stat"><div class="pulse-label">Closest Game</div><div class="pulse-value" id="closest">—</div></div>
        <div class="pulse-stat"><div class="pulse-label">High Score</div><div class="pulse-value" id="highScore">—</div></div>
        <div class="pulse-stat"><div class="pulse-label">Biggest Lead</div><div class="pulse-value" id="bigLead">—</div></div>
      </section>
      <section class="card leaders"><div class="section-title">Top Players Right Now</div><div id="leaders"></div></section>
    </aside>
  </main>
  <div id="error"></div>
  <footer><span>Live fantasy scores from Sleeper • Updates every 15 seconds</span><span id="weekLine">NFL Week —</span></footer>
</div>
<script>
(() => {
  const LEAGUE_ID='1392346581944012800', API='https://api.sleeper.app/v1', POLL_MS=15000, BIG_PLAY=3.0;
  let players={},users={},rosters=[],previousPlayerPoints=new Map(),previousLeaders=new Map(),firstPoll=true;
  const $=id=>document.getElementById(id);
  const fetchJson=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()};
  const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>Number(n||0).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
  const ownerName=ownerId=>{const u=users[ownerId]||{};return u.metadata?.team_name||u.display_name||'Team'};
  const playerName=id=>{const p=players[id]||{};return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id};
  const position=id=>players[id]?.position||'';

  async function loadPlayers(){try{const cached=localStorage.getItem('sleeperPlayersNFL'),stamp=Number(localStorage.getItem('sleeperPlayersNFLStamp')||0);if(cached&&Date.now()-stamp<24*60*60*1000){players=JSON.parse(cached);return}}catch(e){}players=await fetchJson(`${API}/players/nfl`);try{localStorage.setItem('sleeperPlayersNFL',JSON.stringify(players));localStorage.setItem('sleeperPlayersNFLStamp',String(Date.now()))}catch(e){}}

  async function bootstrap(){const [league,leagueUsers,leagueRosters,state]=await Promise.all([fetchJson(`${API}/league/${LEAGUE_ID}`),fetchJson(`${API}/league/${LEAGUE_ID}/users`),fetchJson(`${API}/league/${LEAGUE_ID}/rosters`),fetchJson(`${API}/state/nfl`),loadPlayers()]);users=Object.fromEntries(leagueUsers.map(u=>[u.user_id,u]));rosters=leagueRosters;$('leagueLine').textContent=league.name;$('weekLine').textContent=`NFL Week ${state.week}`;await poll(state.week);setInterval(()=>poll(state.week),POLL_MS)}

  function matchupGroups(matchups){const groups=new Map();matchups.forEach(m=>{if(!groups.has(m.matchup_id))groups.set(m.matchup_id,[]);groups.get(m.matchup_id).push(m)});return[...groups.values()].sort((a,b)=>(a[0]?.matchup_id||0)-(b[0]?.matchup_id||0))}
  function renderMatchups(matchups){const rosterMap=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));$('matchups').innerHTML=matchupGroups(matchups).map(pair=>{const a=pair[0],b=pair[1],ra=rosterMap[a?.roster_id]||{},rb=rosterMap[b?.roster_id]||{},sa=Number(a?.points||0),sb=Number(b?.points||0);const team=(m,r,winning)=>`<div class="team ${winning?'winner':''}"><div><div class="team-name">${esc(ownerName(r.owner_id))}</div><div class="team-meta">${(m?.starters||[]).slice(0,3).map(id=>playerName(id)).join(' • ')}</div></div><div class="team-score">${fmt(m?.points)}</div></div>`;return`<article class="card matchup">${team(a,ra,sa>sb)}<div class="vs">MATCHUP ${esc(a?.matchup_id??'')}</div>${team(b,rb,sb>sa)}</article>`}).join('')}

  function collectPlayerScores(matchups){const rosterMap=Object.fromEntries(rosters.map(r=>[r.roster_id,r])),rows=[];for(const m of matchups){const pp=m.players_points||{},starterSet=new Set(m.starters||[]);for(const[id,pts]of Object.entries(pp))rows.push({id,pts:Number(pts||0),owner:ownerName(rosterMap[m.roster_id]?.owner_id),starter:starterSet.has(id)})}return rows}

  function updatePulse(rows,matchups){let best=null;for(const r of rows){const old=previousPlayerPoints.get(r.id);if(old!==undefined){const delta=r.pts-old;if(delta>0&&(!best||delta>best.delta))best={...r,delta}}previousPlayerPoints.set(r.id,r.pts)}
    const currentLeaderByMatchup=new Map();for(const pair of matchupGroups(matchups)){if(pair.length<2)continue;const a=pair[0],b=pair[1],leader=Number(a.points||0)===Number(b.points||0)?null:(Number(a.points||0)>Number(b.points||0)?a.roster_id:b.roster_id);currentLeaderByMatchup.set(a.matchup_id,leader);const prev=previousLeaders.get(a.matchup_id);if(!firstPoll&&prev&&leader&&prev!==leader&&!best){const roster=rosters.find(r=>r.roster_id===leader);best={leadChange:true,owner:ownerName(roster?.owner_id)}}previousLeaders.set(a.matchup_id,leader)}
    if(firstPoll){firstPoll=false;return}if(best?.leadChange){$('eventCard').querySelector('.eyebrow').textContent='🔥 Lead Change';$('eventPlayer').textContent=best.owner;$('eventDetail').textContent='Just took the lead in a family matchup.';return}if(best){const big=best.delta>=BIG_PLAY;$('eventCard').querySelector('.eyebrow').textContent=big?'⚡ Big Fantasy Play':'Fantasy Points Added';$('eventPlayer').textContent=`${playerName(best.id)}${position(best.id)?' ('+position(best.id)+')':''}`;$('eventDetail').innerHTML=`<span class="delta">+${fmt(best.delta)}</span> for ${esc(best.owner)} • ${fmt(best.pts)} total`}}

  function renderLeaders(rows){const leaders=rows.filter(r=>r.starter&&r.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,8);$('leaders').innerHTML=leaders.length?leaders.map(r=>`<div class="leader-row"><div><div class="leader-name">${esc(playerName(r.id))}${position(r.id)?' ('+esc(position(r.id))+')':''}</div><div class="leader-owner">${esc(r.owner)}</div></div><div class="leader-score">${fmt(r.pts)}</div></div>`).join(''):'<div class="event-detail">No starter scoring yet.</div>'}

  function renderStats(matchups){const rosterMap=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));let closest=null,biggest=null,high=null;for(const pair of matchupGroups(matchups)){if(pair.length<2)continue;const a=pair[0],b=pair[1],sa=Number(a.points||0),sb=Number(b.points||0),diff=Math.abs(sa-sb);if(!closest||diff<closest.diff)closest={diff,a,b};if(!biggest||diff>biggest.diff)biggest={diff,a,b};for(const m of pair){const score=Number(m.points||0);if(!high||score>high.score)high={score,m}}}if(closest){$('closest').textContent=`${fmt(closest.diff)} pts`;}if(high){$('highScore').textContent=`${fmt(high.score)} • ${ownerName(rosterMap[high.m.roster_id]?.owner_id)}`;}if(biggest){$('bigLead').textContent=`${fmt(biggest.diff)} pts`;}}

  async function poll(week){try{const matchups=await fetchJson(`${API}/league/${LEAGUE_ID}/matchups/${week}`);renderMatchups(matchups);const rows=collectPlayerScores(matchups);updatePulse(rows,matchups);renderLeaders(rows);renderStats(matchups);$('statusText').textContent='LIVE';$('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});$('error').style.display='none'}catch(e){$('statusText').textContent='RETRYING';$('error').textContent=`Could not refresh Sleeper: ${e.message}`;$('error').style.display='block'}}
  bootstrap().catch(e=>{$('statusText').textContent='OFFLINE';$('error').textContent=`Could not start dashboard: ${e.message}`;$('error').style.display='block'});
})();
</script>
</body>
</html>
