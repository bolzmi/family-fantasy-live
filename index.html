<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>Bolz Family Fantasy Live</title>
<style>
:root{--bg:#07111d;--panel:#0d1b2a;--panel2:#12263a;--text:#f4f7fb;--muted:#a9b9ca;--line:#28465f;--good:#43d17f;--hot:#ffcc4d;--accent:#65a9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{overflow:hidden}#app{height:100vh;padding:2vh 2vw 1.5vh;display:grid;grid-template-rows:9vh 1fr 3vh;gap:1.4vh}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:3.1vw;line-height:1;font-weight:900}.sub{margin-top:.7vh;color:var(--muted);font-size:1.15vw}.status{text-align:right;color:var(--muted);font-size:1vw;line-height:1.5}.live-dot{display:inline-block;width:.7vw;height:.7vw;border-radius:50%;background:var(--good);box-shadow:0 0 1vw var(--good);margin-right:.45vw}.screen{min-height:0;display:grid;grid-template-columns:68% 32%;gap:1vw}.matchups{min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:1vh .7vw}.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:1.1vw;box-shadow:0 .5vw 1.5vw rgba(0,0,0,.2)}.matchup{padding:1.25vh 1vw;display:grid;grid-template-rows:1fr auto 1fr;min-height:0}.team{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.8vw}.team-name{font-size:1.5vw;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team-score{font-size:2.7vw;font-weight:950;font-variant-numeric:tabular-nums}.team-meta{margin-top:.35vh;color:var(--muted);font-size:.78vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.winner .team-score{color:var(--good)}.vs{display:flex;align-items:center;gap:.5vw;color:var(--muted);font-size:.58vw;font-weight:900;letter-spacing:.16em}.vs:before,.vs:after{content:"";height:1px;background:var(--line);flex:1}.side{min-height:0;display:grid;grid-template-rows:26% 11% 1fr;gap:1vh}.event{position:relative;overflow:hidden;padding:1.6vh 1.2vw;display:flex;flex-direction:column;justify-content:center}.event:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,204,77,.14),transparent 58%);pointer-events:none}.eyebrow{font-size:.78vw;font-weight:950;letter-spacing:.15em;color:var(--hot);text-transform:uppercase}.event-player{font-size:2.25vw;font-weight:950;line-height:1.04;margin-top:.65vh}.event-detail{font-size:1.08vw;color:var(--muted);margin-top:.8vh}.delta{font-weight:950;color:var(--good)}.pulse-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45vw}.pulse-stat{background:var(--panel);border:1px solid var(--line);border-radius:.8vw;padding:.8vh .65vw;min-width:0}.pulse-label{font-size:.55vw;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:900}.pulse-value{font-size:1.08vw;font-weight:950;margin-top:.35vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.leaders{padding:1.2vh 1vw;overflow:hidden}.section-title{font-size:.72vw;font-weight:950;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:.5vh}.leader-row{display:grid;grid-template-columns:1fr auto;gap:.7vw;align-items:center;padding:.72vh 0;border-top:1px solid var(--line)}.leader-row:first-of-type{border-top:0}.leader-name{font-size:1.02vw;font-weight:850}.leader-owner{font-size:.7vw;color:var(--muted);margin-top:.15vh}.leader-score{font-size:1.32vw;font-weight:950;font-variant-numeric:tabular-nums}footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.72vw}#error{position:fixed;left:2vw;right:2vw;bottom:2vh;display:none;background:#401e28;border:1px solid #713044;padding:1vh 1vw;border-radius:.6vw;z-index:10}
@media(max-aspect-ratio:1.45/1){body{overflow:auto}#app{height:auto;min-height:100vh}.screen{grid-template-columns:1fr}.matchups{grid-template-columns:1fr 1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:auto}.leaders{max-height:45vh}}
</style></head><body><div id="app"><header><div><h1>Bolz Family Fantasy Live</h1><div class="sub" id="leagueLine">Loading league…</div></div><div class="status"><span class="live-dot"></span><span id="statusText">Connecting</span><br><span id="updated"></span></div></header><main class="screen"><section class="matchups" id="matchups"></section><aside class="side"><section class="card event" id="eventCard"><div class="eyebrow">Fantasy Pulse</div><div class="event-player" id="eventPlayer">Waiting for scoring…</div><div class="event-detail" id="eventDetail">Big plays and lead changes will appear here.</div></section><section class="pulse-grid"><div class="pulse-stat"><div class="pulse-label">Closest</div><div class="pulse-value" id="closest">—</div></div><div class="pulse-stat"><div class="pulse-label">High Score</div><div class="pulse-value" id="highScore">—</div></div><div class="pulse-stat"><div class="pulse-label">Biggest Lead</div><div class="pulse-value" id="bigLead">—</div></div></section><section class="card leaders"><div class="section-title">Top Starters Right Now</div><div id="leaders"></div></section></aside></main><div id="error"></div><footer><span>Live fantasy scores from Sleeper • refreshes every 15 seconds</span><span id="weekLine">NFL Week —</span></footer></div>
<script>(()=>{const LEAGUE_ID='1392346581944012800',API='https://api.sleeper.app/v1',POLL_MS=15000,BIG_PLAY=3;let players={},users={},rosters=[],previousPlayerPoints=new Map(),previousLeaders=new Map(),firstPoll=true;const $=id=>document.getElementById(id),fetchJson=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()},esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1'),ownerName=id=>{const u=users[id]||{};return u.metadata?.team_name||u.display_name||'Team'},playerName=id=>{const p=players[id]||{};return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id},position=id=>players[id]?.position||'';async function loadPlayers(){try{const c=localStorage.getItem('sleeperPlayersNFL'),s=Number(localStorage.getItem('sleeperPlayersNFLStamp')||0);if(c&&Date.now()-s<86400000){players=JSON.parse(c);return}}catch(e){}players=await fetchJson(`${API}/players/nfl`);try{localStorage.setItem('sleeperPlayersNFL',JSON.stringify(players));localStorage.setItem('sleeperPlayersNFLStamp',Date.now())}catch(e){}}async function bootstrap(){const[league,leagueUsers,leagueRosters,state]=await Promise.all([fetchJson(`${API}/league/${LEAGUE_ID}`),fetchJson(`${API}/league/${LEAGUE_ID}/users`),fetchJson(`${API}/league/${LEAGUE_ID}/rosters`),fetchJson(`${API}/state/nfl`),loadPlayers()]);users=Object.fromEntries(leagueUsers.map(u=>[u.user_id,u]));rosters=leagueRosters;$('leagueLine').textContent=league.name;$('weekLine').textContent=`NFL Week ${state.week}`;await poll(state.week);setInterval(()=>poll(state.week),POLL_MS)}function matchupGroups(ms){const g=new Map;ms.forEach(m=>{if(!g.has(m.matchup_id))g.set(m.matchup_id,[]);g.get(m.matchup_id).push(m)});return[...g.values()].sort((a,b)=>(a[0]?.matchup_id||0)-(b[0]?.matchup_id||0))}function renderMatchups(ms){const rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));$('matchups').innerHTML=matchupGroups(ms).map(pair=>{const a=pair[0],b=pair[1],ra=rm[a?.roster_id]||{},rb=rm[b?.roster_id]||{},sa=Number(a?.points||0),sb=Number(b?.points||0),team=(m,r,w)=>`<div class="team ${w?'winner':''}"><div><div class="team-name">${esc(ownerName(r.owner_id))}</div><div class="team-meta">${(m?.starters||[]).slice(0,3).map(playerName).join(' • ')}</div></div><div class="team-score">${fmt(m?.points)}</div></div>`;return`<article class="card matchup">${team(a,ra,sa>sb)}<div class="vs">MATCHUP ${esc(a?.matchup_id??'')}</div>${team(b,rb,sb>sa)}</article>`}).join('')}function collectPlayerScores(ms){const rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r])),rows=[];for(const m of ms){const pp=m.players_points||{},ss=new Set(m.starters||[]);for(const[id,pts]of Object.entries(pp))rows.push({id,pts:Number(pts||0),owner:ownerName(rm[m.roster_id]?.owner_id),starter:ss.has(id)})}return rows}function updatePulse(rows,ms){let best=null;for(const r of rows){const old=previousPlayerPoints.get(r.id);if(old!==undefined){const d=r.pts-old;if(d>0&&(!best||d>best.delta))best={...r,delta:d}}previousPlayerPoints.set(r.id,r.pts)}for(const pair of matchupGroups(ms)){if(pair.length<2)continue;const a=pair[0],b=pair[1],leader=Number(a.points||0)===Number(b.points||0)?null:(Number(a.points||0)>Number(b.points||0)?a.roster_id:b.roster_id),prev=previousLeaders.get(a.matchup_id);if(!firstPoll&&prev&&leader&&prev!==leader&&!best){const r=rosters.find(x=>x.roster_id===leader);best={leadChange:true,owner:ownerName(r?.owner_id)}}previousLeaders.set(a.matchup_id,leader)}if(firstPoll){firstPoll=false;return}if(best?.leadChange){$('eventCard').querySelector('.eyebrow').textContent='🔥 Lead Change';$('eventPlayer').textContent=best.owner;$('eventDetail').textContent='Just took the lead in a family matchup.'}else if(best){$('eventCard').querySelector('.eyebrow').textContent=best.delta>=BIG_PLAY?'⚡ Big Fantasy Play':'Fantasy Points Added';$('eventPlayer').textContent=`${playerName(best.id)}${position(best.id)?' ('+position(best.id)+')':''}`;$('eventDetail').innerHTML=`<span class="delta">+${fmt(best.delta)}</span> for ${esc(best.owner)} • ${fmt(best.pts)} total`}}function renderLeaders(rows){const ls=rows.filter(r=>r.starter&&r.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,7);$('leaders').innerHTML=ls.length?ls.map(r=>`<div class="leader-row"><div><div class="leader-name">${esc(playerName(r.id))}${position(r.id)?' ('+esc(position(r.id))+')':''}</div><div class="leader-owner">${esc(r.owner)}</div></div><div class="leader-score">${fmt(r.pts)}</div></div>`).join(''):'<div class="event-detail">No starter scoring yet.</div>'}function renderStats(ms){const rm=Object.fromEntries(rosters.map(r=>[r.roster_id,r]));let closest,biggest,high;for(const pair of matchupGroups(ms)){if(pair.length<2)continue;const[a,b]=pair,sa=Number(a.points||0),sb=Number(b.points||0),d=Math.abs(sa-sb);if(!closest||d<closest.diff)closest={diff:d};if(!biggest||d>biggest.diff)biggest={diff:d};for(const m of pair){const s=Number(m.points||0);if(!high||s>high.score)high={score:s,m}}}if(closest)$('closest').textContent=`${fmt(closest.diff)} pts`;if(high)$('highScore').textContent=`${fmt(high.score)} • ${ownerName(rm[high.m.roster_id]?.owner_id)}`;if(biggest)$('bigLead').textContent=`${fmt(biggest.diff)} pts`}async function poll(week){try{const ms=await fetchJson(`${API}/league/${LEAGUE_ID}/matchups/${week}`);renderMatchups(ms);const rows=collectPlayerScores(ms);updatePulse(rows,ms);renderLeaders(rows);renderStats(ms);$('statusText').textContent='LIVE';$('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});$('error').style.display='none'}catch(e){$('statusText').textContent='RETRYING';$('error').textContent=`Could not refresh Sleeper: ${e.message}`;$('error').style.display='block'}}bootstrap().catch(e=>{$('statusText').textContent='OFFLINE';$('error').textContent=`Could not start dashboard: ${e.message}`;$('error').style.display='block'})})();</script></body></html>
